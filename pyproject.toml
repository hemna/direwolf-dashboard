[build-system]
requires = ["setuptools>=69.5.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "direwolf-dashboard"
version = "1.0.8"
description = "Lightweight web-based live display of Direwolf activity for Raspberry Pi"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    {name = "Craig Lamparter"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Ham Radio",
]
dependencies = [
    "starlette>=0.27.0",
    "uvicorn>=0.24.0",
    "aprslib @ git+https://github.com/hemna/aprs-python.git@ab9f9113831a2bd2948d6178c7ffc1c9c075a6af",
    "aiosqlite>=0.19.0",
    "haversine>=2.8.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "websockets>=12.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
direwolf-dashboard = "direwolf_dashboard.cli:main"

[project.urls]
Homepage = "https://github.com/hemna/direwolf-dashboard"
"Bug Reports" = "https://github.com/hemna/direwolf-dashboard/issues"
Source = "https://github.com/hemna/direwolf-dashboard"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["direwolf_dashboard"]

[tool.setuptools.package-data]
direwolf_dashboard = [
    "static/**/*",
    "static/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E: pycodestyle errors  F: pyflakes  I: isort  UP: pyupgrade
# B: flake8-bugbear  C4: flake8-comprehensions  SIM: flake8-simplify
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",    # line too long (handled by formatter)
    "B008",    # do not perform function calls in default arguments
    "SIM105",  # contextlib.suppress — verbose; try/except/pass is fine in tests
    "SIM108",  # ternary operator — sometimes less readable
    "SIM117",  # nested with — sometimes clearer for readability
    "UP007",   # X | Y union syntax — keep Optional[] for clarity
]

[tool.ruff.lint.isort]
known-first-party = ["direwolf_dashboard"]
